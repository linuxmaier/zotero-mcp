name: Hosted image

# Builds docker/hosted.Dockerfile (see AGENTS.md). Pull requests and main build
# only. The production branch also pushes to GHCR, tagged with the commit SHA
# and `production`, for the home-server platform to pin by digest: pushing to
# production is what deploys.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - production
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  hosted-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/production'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/zotero-mcp-hosted
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=production

      - name: Build and (on production) push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/hosted.Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/production' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=hosted
          cache-to: type=gha,mode=max,scope=hosted
