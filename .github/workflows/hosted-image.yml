name: Hosted image

# Builds docker/hosted.Dockerfile (see AGENTS.md). Pull requests and main build
# only. The production branch also pushes to GHCR, tagged with the commit SHA
# and `production`, for the home-server platform to pin by digest: pushing to
# production is what deploys.
#
# After a push to GHCR, the release job deploys it: it opens a PR in linuxmaier/home-server that
# pins the new digest in apps/zotero/compose.yml, waits for home-server's CI, and merges it, which
# starts home-server's Deploy workflow (home-server ADR 0013), and then waits for that Deploy, so
# the run fails if the release doesn't reach the host. It acts as the home-server-release
# GitHub App, installed only on home-server. The app's key is a secret of the home-server-release
# environment, which only the production branch can use. The job does nothing until the
# HOME_SERVER_APP_CLIENT_ID repository variable is set.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - production
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time, so an older release can't be pinned after a newer one.
concurrency:
  group: hosted-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hosted-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push ghcr.io/linuxmaier/zotero-mcp-hosted (production only)
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/production'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/zotero-mcp-hosted
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=production

      - name: Build and (on production) push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/hosted.Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/production' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=hosted
          cache-to: type=gha,mode=max,scope=hosted

  release:
    name: Deploy to home-server
    needs: hosted-image
    if: github.ref == 'refs/heads/production' && github.event_name != 'pull_request' && vars.HOME_SERVER_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    # Holds the app's private key; only the production branch may use it.
    environment: home-server-release
    # Acts only through the app's token for home-server; needs nothing from this repo.
    permissions: {}
    # Home-server's CI and then its Deploy take a few minutes each; this is both waits plus slack.
    timeout-minutes: 40
    env:
      DIGEST: ${{ needs.hosted-image.outputs.digest }}
      APP_NAME: zotero
      BRANCH: zotero-release
      FILE: apps/zotero/compose.yml
      PATTERN: '(zotero-mcp-hosted:production@)sha256:[0-9a-f]{64}'
    steps:
      - name: Token for home-server
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HOME_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOME_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: home-server
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/home-server
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false

      - name: Pin the new digest
        id: pin
        run: |
          if ! grep -Eq "$PATTERN" "$FILE"; then
            echo "::error::No image line matching $PATTERN in home-server's $FILE"
            exit 1
          fi
          sed -Ei "s/$PATTERN/\\1$DIGEST/" "$FILE"
          if git diff --quiet; then
            echo "home-server already runs $DIGEST" >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the release PR
        if: steps.pin.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SLUG: ${{ steps.token.outputs.app-slug }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          user_id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${user_id}+${SLUG}[bot]@users.noreply.github.com"
          # One branch for every release, rebuilt from home-server's main each time. Runs are
          # serialized by the workflow's concurrency group, so a release whose CI failed is simply
          # replaced by the next one. The checkout keeps no credentials, so push with the token.
          git switch -C "$BRANCH"
          git commit -am "$APP_NAME: deploy ${SOURCE_SHA:0:7}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/home-server.git" "$BRANCH"
          title="$APP_NAME: deploy ${SOURCE_SHA:0:7}"
          open_pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$open_pr" ]; then
            gh pr create --head "$BRANCH" --base main --title "$title" \
              --body "Pins the $APP_NAME image built from ${SOURCE_URL}. Opened by the ${GITHUB_REPOSITORY} Hosted image workflow, which merges it once CI passes."
          else
            # REST, not `gh pr edit`: that fails on repos with Projects (classic) deprecation errors.
            gh api -X PATCH "repos/{owner}/{repo}/pulls/$open_pr" -f title="$title" >/dev/null
          fi
          echo "number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for home-server CI, then merge
        if: steps.pin.outputs.changed == 'true'
        id: merge
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          # REST only. `gh pr checks` also reads each check's workflow run, which needs Actions
          # permission the app doesn't have, and `gh pr merge` can hit Projects (classic) errors.
          # Check runs need only Checks: read.
          runs="repos/{owner}/{repo}/commits/$HEAD/check-runs?per_page=100"
          for _ in $(seq 60); do
            sleep 15
            total=$(gh api "$runs" --jq '.total_count')
            pending=$(gh api "$runs" --jq '[.check_runs[] | select(.status != "completed")] | length')
            [ "$total" -gt 0 ] && [ "$pending" -eq 0 ] && break
          done
          failed=$(gh api "$runs" --jq '[.check_runs[] | select(.status == "completed"
            and (.conclusion | IN("success", "skipped", "neutral") | not)) | .name] | join(", ")')
          pending=$(gh api "$runs" --jq '[.check_runs[] | select(.status != "completed")] | length')
          if [ -n "$failed" ] || [ "$pending" -ne 0 ] || [ "$total" -eq 0 ]; then
            echo "::error::home-server checks didn't pass (failed: ${failed:-none}; pending: $pending; total: $total)"
            exit 1
          fi
          # sha: GitHub refuses the merge if the branch moved after CI checked this commit.
          merged=$(gh api -X PUT "repos/{owner}/{repo}/pulls/$NUMBER/merge" \
            -f merge_method=squash -f sha="$HEAD" --jq .sha)
          gh api -X DELETE "repos/{owner}/{repo}/git/refs/heads/$BRANCH" >/dev/null || true
          echo "sha=$merged" >> "$GITHUB_OUTPUT"
          echo "Merged home-server PR #$NUMBER as ${merged:0:7}." >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for home-server's Deploy
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          MERGED: ${{ steps.merge.outputs.sha }}
        run: |
          # The merge starts home-server's CI and Deploy workflows. Deploy's last job is named `host`
          # (home-server .github/workflows/deploy.yml); its check run on the merge commit says whether
          # the release reached the host. Check runs need only Checks: read.
          runs="repos/{owner}/{repo}/commits/$MERGED/check-runs?per_page=100"
          started=$(date +%s)
          while :; do
            sleep 20
            elapsed=$(( $(date +%s) - started ))
            total=$(gh api "$runs" --jq '.total_count')
            # GitHub occasionally drops a push event, and then nothing runs (seen 2026-10-05).
            if [ "$total" -eq 0 ] && [ "$elapsed" -ge 300 ]; then
              echo "::error::Nothing started on home-server's merge commit ${MERGED:0:7} in 5 minutes. GitHub may have dropped the push event: run home-server's Deploy workflow by hand."
              exit 1
            fi
            host=$(gh api "$runs" --jq '[.check_runs[] | select(.name == "host" and .status == "completed") | .conclusion][0] // empty')
            [ -n "$host" ] && break
            if [ "$elapsed" -ge 900 ]; then
              echo "::error::home-server's Deploy hasn't finished on ${MERGED:0:7} after 15 minutes. If no Deploy run exists for it, run the workflow by hand."
              exit 1
            fi
          done
          if [ "$host" != "success" ]; then
            echo "::error::home-server's Deploy didn't succeed (host job: $host). The release is merged but not running; see the Deploy run in home-server."
            exit 1
          fi
          echo "home-server's Deploy finished: the release is running." >> "$GITHUB_STEP_SUMMARY"
